    <script>
      // Catch Chrome's install offer before the app loads so it's never missed.
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; window.dispatchEvent(new Event('finlit-bip')); });
      window.addEventListener('appinstalled', function () { window.__bip = null; window.dispatchEvent(new Event('finlit-bip')); });
    </script>

    <script type="text/javascript">
      // Handle SPA redirect from 404.html
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
